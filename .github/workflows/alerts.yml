name: Insider & Congress Alerts
on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MIN_PURCHASE_USD: "100000"
          INCLUDE_DIRECTORS: "false"
          SEC_PAGES: "3"
        run: python monitor.py
      - name: Save state
        run: bash save_state.sh
